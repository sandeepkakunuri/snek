*{margin:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#07061c;font-family:system-ui,sans-serif;color:#eaf2ff}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;
 background:radial-gradient(circle at 50% 40%,#2b1a6b,#07061c 70%);animation:flash calc(var(--beat)*2) steps(1) infinite}
@keyframes flash{0%{background-color:#2a0f6e}50%{background-color:#0a2a6e}}
#floor{position:fixed;left:50%;bottom:8vh;width:70vmin;height:14vmin;transform:translateX(-50%);
 background:radial-gradient(ellipse,#9b6bffaa,#4cc9ff44 50%,transparent 70%);filter:blur(6px);animation:glow var(--beat) ease-in-out infinite}
@keyframes glow{50%{opacity:.45;transform:translateX(-50%) scale(.85)}}
#dancer{position:relative;width:min(78vmin,560px);aspect-ratio:1;animation:move calc(var(--beat)*8) ease-in-out infinite;transform-origin:50% 95%;perspective:900px}
@keyframes move{
 0%{transform:translate(0,0) rotate(0)}
 6.25%{transform:translate(0,-5%) scale(1.02,.98)}
 12.5%{transform:translate(0,0) scale(.97,1.03)}
 18.75%{transform:translate(0,-5%)}
 25%{transform:translate(-6%,0) rotate(-7deg)}
 37.5%{transform:translate(6%,0) rotate(7deg)}
 50%{transform:translate(-6%,0) rotate(-7deg)}
 56.25%{transform:translate(0,-14%) scale(1.04)}
 62.5%{transform:translate(0,0) scale(.95,1.06)}
 68.75%{transform:translate(0,-14%) scale(1.04)}
 75%{transform:translate(0,0) scale(.95,1.06)}
 87.5%{transform:translate(0,-10%) rotateY(360deg)}
 100%{transform:translate(0,0) rotateY(360deg)}}
.layer{position:absolute;inset:0;border-radius:6%;background:var(--img) center/cover}
#body{animation:squash var(--beat) ease-in-out infinite;transform-origin:50% 100%;box-shadow:0 20px 60px #000a}
@keyframes squash{50%{transform:scale(1.025,.975)}}
#head{clip-path:polygon(0 0,100% 0,100% 56%,0 56%);transform-origin:50% 56%;animation:nod calc(var(--beat)*2) ease-in-out infinite}
@keyframes nod{0%,100%{transform:rotate(-5deg) translateY(1%)}25%{transform:rotate(0) translateY(-2%)}50%{transform:rotate(5deg) translateY(1%)}75%{transform:rotate(0) translateY(-2%)}}
#hands{clip-path:polygon(24% 44%,76% 44%,76% 78%,24% 78%);transform-origin:50% 60%;animation:pat var(--beat) ease-in-out infinite}
@keyframes pat{50%{transform:translateY(-3%) scale(1.04)}}
#hint{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);text-align:center;font-size:13px;opacity:.75}
#handle{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);font-size:clamp(22px,6vw,34px);font-weight:800;letter-spacing:.04em;background:linear-gradient(90deg,#9b6bff,#4cc9ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px #9b6bff99)}
#spdl{display:flex;align-items:center;gap:8px;font-size:13px;background:#ffffff18;border:1px solid #ffffff44;border-radius:999px;padding:6px 14px}
#spdl span{min-width:76px;text-align:right;font-variant-numeric:tabular-nums}
#spdl input{width:min(34vw,160px);accent-color:#9b6bff}
#btns{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:8px}
button{font:inherit;font-size:13px;color:#eaf2ff;background:#ffffff18;border:1px solid #ffffff44;border-radius:999px;padding:9px 16px;cursor:pointer}
button.on{background:linear-gradient(90deg,#9b6bff,#4cc9ff);color:#07061c;font-weight:700;border-color:transparent}
@media (prefers-reduced-motion:reduce){body{animation:none}}
</style>
</head>
<body>
<div id="floor"></div>
<div id="dancer">
  <div class="layer" id="body"></div>
  <div class="layer" id="head"></div>
  <div class="layer" id="hands"></div>
</div>
<div id="handle">@adadolphy</div>
<div id="btns"><button id="mus">🎵 Music</button><label id="spdl"><span id="spdv">120 BPM</span><input type="range" id="spd" min="60" max="1000" value="120"></label></div>
<script>
let bpm=120,ac,timer,step=0,next=0;
const root=document.documentElement,mus=document.getElementById("mus"),spd=document.getElementById("spd");
const spdv=document.getElementById("spdv");
function setBpm(b){bpm=b;root.style.setProperty("--beat",(60/b)+"s");spdv.textContent=b+" BPM"}
spd.oninput=()=>setBpm(+spd.value);
function tone(t,f,len,type,vol,fEnd){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
 if(fEnd)o.frequency.exponentialRampToValueAtTime(fEnd,t+len);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+len);
 o.connect(g).connect(ac.destination);o.start(t);o.stop(t+len)}
function sched(){while(next<ac.currentTime+.2){const b=60/bpm;
 if(step%2===0)tone(next,150,.18,"sine",.9,45);          // kick on each beat
 else tone(next,1800,.05,"square",.06);                   // off-beat hat
 if(step%8===4)tone(next,300,.12,"triangle",.3,200);      // snare-ish
 const bass=[55,55,82,73][Math.floor(step/2)%4];if(step%2===0)tone(next,bass*2,b*.9,"sawtooth",.12);
 next+=b/2;step++}}
mus.onclick=()=>{if(timer){clearInterval(timer);timer=null;mus.classList.remove("on");return}
 ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();next=ac.currentTime+.05;step=0;
 timer=setInterval(sched,50);mus.classList.add("on")};
</script>
</body>
</html>
